<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Fees</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <img src="/images/logo.png" alt="School Logo" style="width:60px; height:60px; object-fit:contain;">
      <h2>School MS</h2>
    </div>
    <nav class="sidebar-nav">
      <a href="/admin/dashboard" class="nav-item">📊 Dashboard</a>
      <a href="/admin/classes" class="nav-item">🏛️ Classes</a>
      <a href="/admin/subjects" class="nav-item">📚 Subjects</a>
      <a href="/admin/teachers" class="nav-item">👨‍🏫 Teachers</a>
      <a href="/admin/results" class="nav-item">📝 Results</a>
      <a href="/admin/fees" class="nav-item active">💰 Fees</a>
      <a href="/admin/applications" class="nav-item">📋 Applications</a>
      <a href="/admin/idcard" class="nav-item">🪪 ID Cards</a>
      <a href="/auth/logout" class="nav-item logout">🚪 Logout</a>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="main-content">

    <!-- Topbar -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu">☰</button>
    <div class="topbar">
      <h2>Manage Fees</h2>
      <div class="admin-info">
        <span>👤 Super Admin</span>
      </div>
    </div>

    <!-- Add Fee Form -->
    <div class="form-card">
      <h3>Set School Fees Amount for Each Class</h3>
      <div class="form-row">

        <div class="form-group">
          <label>Class</label>
          <select id="class_id">
            <option value="">-- Select Class --</option>
          </select>
        </div>

        <div class="form-group">
          <label>Fee Name</label>
          <input type="text" id="payment_type" placeholder="e.g. School Fees" value="School Fees" />
        </div>

        <div class="form-group">
          <label>Amount (₦)</label>
          <input type="number" id="amount" placeholder="e.g. 25000" />
        </div>

        <div class="form-group">
          <label>&nbsp;</label>
          <button onclick="addFee()" class="btn-add">+ Add Fee</button>
        </div>

      </div>
      <div id="form-msg" class="form-msg hidden"></div>
    </div>

    <!-- Fees Table -->
    <div class="recent-section">
      <h3>All Fees Amount</h3>
      <table class="data-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Class</th>
            <th>Fee Name</th>
            <th>Amount</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="feesTable">
          <tr>
            <td colspan="5" style="text-align:center">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script src="/js/admin/fees.js"></script>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <script>
    (function() {
      const toggle = document.getElementById('sidebarToggle');
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      if (toggle && sidebar && overlay) {
        function closeSidebar() {
          sidebar.classList.remove('sidebar-open');
          overlay.classList.remove('active');
        }
        toggle.addEventListener('click', function() {
          sidebar.classList.toggle('sidebar-open');
          overlay.classList.toggle('active');
        });
        overlay.addEventListener('click', closeSidebar);
        sidebar.querySelectorAll('a').forEach(function(a) {
          a.addEventListener('click', closeSidebar);
        });
      }
    })();
  </script>
</body>
</html>
